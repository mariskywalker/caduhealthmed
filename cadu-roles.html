      // ────────────────── ROUTER ──────────────────
      function getHashRoute() {
        const h = (location.hash || "").replace(/^#\/?/, "");
        if (!h || h === "hub") return { role: null, page: "hub" };
        const idx = h.indexOf("/");
        const role = idx === -1 ? h : h.substring(0, idx);
        const page = idx === -1 ? "" : h.substring(idx + 1);
        if (!ROLES[role]) return { role: null, page: "hub" };
        return { role, page: page || ROLES[role].nav[0].href.split("/")[1] };
      }

      function navigate(target) {
        if (target === "hub") {
          location.hash = "";
        } else {
          location.hash = target;
        }
      }

      // ────────────────── RENDER SHELL ──────────────────
      function renderSidenav(role, currentHref) {
        const cfg = ROLES[role];
        document.getElementById("sidenav-role-label").innerHTML = cfg.label;
        document.getElementById("sidenav-user-name").innerHTML = cfg.userName;
        document.getElementById("sidenav-user-role").innerHTML = cfg.userRole;
        const initials = cfg.userName
          .replace(/&[a-z]+;/gi, "")
          .split(" ")
          .filter((p) => p.length > 1 && !/^(Dr|Dra|Prof|Profa)\.?$/i.test(p))
          .slice(0, 2)
          .map((p) => p[0])
          .join("")
          .toUpperCase();
        document.getElementById("sidenav-avatar").textContent = initials || "U";

        const nav = document.getElementById("sidenav-nav");
        nav.innerHTML = cfg.nav
          .map((item) => {
            const isActive = currentHref === item.href;
            const cls = isActive

      function evolutionSummaryChips() {
        return METRIC_KEYS.map((key) => {
          const values = PARENT_EVOLUTION.map((p) => p[key]).filter((v) => v !== null && v !== undefined);
          if (values.length === 0) return "";
          const latest = values[values.length - 1];
          const first = values[0];
          const diff = latest - first;
          const c = METRIC_COLORS_FULL[key];
          const diffCls = diff > 0 ? "text-green-600" : diff < 0 ? "text-red-500" : "text-ink-400";
          const diffText = diff > 0 ? "+" + diff : diff === 0 ? "=" : String(diff);
          return `<div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-[10px] border" style="background-color:${c.pastel};border-color:${c.dark}30">
            <span class="text-xs font-medium" style="color:${c.dark}">${METRIC_LABELS[key]}</span>
            <span class="text-xs font-bold" style="color:${c.dark}">${latest}</span>
            ${values.length > 1 ? `<span class="text-xs font-medium ${diffCls}">${diffText}</span>` : ""}
          </div>`;
        }).join("");
      }

      function evolutionMetricFilterPills() {
        return METRIC_KEYS.map((key) => {
          const active = evolutionState.activeMetrics.has(key);
          const c = METRIC_COLORS_FULL[key];
          const style = active
            ? `background-color:${c.pastel};color:${c.dark};border-color:${c.dark}4D`
            : `background-color:rgba(255,255,255,0.6);color:#aaa;border-color:transparent`;
          return `<button data-metric-toggle="${key}" class="px-2.5 py-1 text-xs font-medium rounded-full border transition-all" style="${style}">${METRIC_LABELS[key]}</button>`;
        }).join("");
      }

      function evolutionDetailCards() {
        return METRIC_KEYS.filter((k) => evolutionState.activeMetrics.has(k))
          .map((key) => {
            const values = PARENT_EVOLUTION.map((p) => p[key]).filter((v) => v !== null && v !== undefined);
            if (values.length === 0) return "";
            const latest = values[values.length - 1];
            const first = values[0];
            const diff = latest - first;
            const avg = Math.round((values.reduce((a, b) => a + b, 0) / values.length) * 10) / 10;
            const c = METRIC_COLORS_FULL[key];
            const diffCls = diff > 0 ? "text-green-600" : diff < 0 ? "text-red-500" : "text-ink-400";
            const diffText = diff > 0 ? `+${diff}` : diff === 0 ? "Est\u00e1vel" : String(diff);
            return `<div class="bg-white/60 rounded-[16px] p-3">
              <div class="bg-white/60 rounded-[12px] p-3">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full" style="background-color:${c.line}"></div>
                    <span class="text-sm font-medium text-ink-800">${METRIC_LABELS[key]}</span>

                  <span class="text-lg font-bold text-ink-900">${latest}<span class="text-xs text-ink-400 font-normal">/10</span></span>
                </div>
                <div class="flex gap-4">
                  <div><p class="text-xs text-ink-400">M&eacute;dia</p><p class="text-xs font-medium text-ink-700">${avg}</p></div>
                  <div><p class="text-xs text-ink-400">Progresso</p><p class="text-xs font-medium ${diffCls}">${diffText}</p></div>
                  <div><p class="text-xs text-ink-400">Avalia&ccedil;&otilde;es</p><p class="text-xs font-medium text-ink-700">${values.length}</p></div>
                </div>
                <div class="mt-2.5 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                  <div class="h-full rounded-full" style="width:${(latest / 10) * 100}%;background-color:${c.line}"></div>

            </div>`;

      }

      function renderParentEvolutionChart() {
        if (evolutionState.chart) {
          evolutionState.chart.destroy();
          evolutionState.chart = null;
        }
        if (evolutionState.view === "lines") {
          const canvas = document.getElementById("parent-evolution-chart");
          if (!canvas) return;
          const activeKeys = METRIC_KEYS.filter((k) => evolutionState.activeMetrics.has(k));
          evolutionState.chart = new Chart(canvas, {
            type: "line",
            data: {
              labels: PARENT_EVOLUTION.map((p) => p.date),
              datasets: activeKeys.map((key) => ({
                label: METRIC_LABELS[key],
                data: PARENT_EVOLUTION.map((p) => p[key]),
                borderColor: METRIC_COLORS_FULL[key].line,
                backgroundColor: METRIC_COLORS_FULL[key].line + "20",
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 3,
              })),
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: "bottom", labels: { font: { size: 11 }, color: "#6B6B6B", boxWidth: 10, padding: 10 } },
                tooltip: { backgroundColor: "rgba(255,255,255,0.95)", titleColor: "#161616", bodyColor: "#333", borderColor: "#eee", borderWidth: 1, cornerRadius: 12, padding: 12 },
              },
              scales: {
                y: { min: 0, max: 10, ticks: { color: "#999", font: { size: 11 } }, grid: { color: "#f0f0f0" } },
                x: { ticks: { color: "#999", font: { size: 11 } }, grid: { display: false } },
              },
            },
          });
        } else {
          const canvas = document.getElementById("parent-evolution-radar");
          if (!canvas) return;
          const latest = PARENT_EVOLUTION[PARENT_EVOLUTION.length - 1];
          evolutionState.chart = new Chart(canvas, {
            type: "radar",
            data: {
              labels: METRIC_KEYS.map((k) => METRIC_LABELS[k]),
              datasets: [
                {
                  label: "\u00daltima avalia\u00e7\u00e3o",
                  data: METRIC_KEYS.map((k) => latest[k]),
                  backgroundColor: "rgba(89,0,255,0.20)",
                  borderColor: "#5900FF",
                  borderWidth: 2,
                  pointBackgroundColor: "#5900FF",
                  pointRadius: 3,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  min: 0,
                  max: 10,
                  ticks: { stepSize: 2, color: "#bbb", backdropColor: "transparent", font: { size: 10 } },
                  grid: { color: "#eee" },
                  angleLines: { color: "#eee" },
                  pointLabels: { font: { size: 11 }, color: "#666" },
                },
              },
              plugins: { legend: { display: false } },
            },
          });
        }
      }

      function setupParentEvolutionPage() {
        document.querySelectorAll("[data-evo-view]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const v = btn.getAttribute("data-evo-view");
            if (v !== evolutionState.view) {
              evolutionState.view = v;
              rerenderParentEvolution();
            }
          });
        });
        document.querySelectorAll("[data-metric-toggle]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.getAttribute("data-metric-toggle");
            if (evolutionState.activeMetrics.has(key)) {
              if (evolutionState.activeMetrics.size > 1) evolutionState.activeMetrics.delete(key);
            } else {
              evolutionState.activeMetrics.add(key);
            }
            rerenderParentEvolution();
          });
        });
        renderParentEvolutionChart();
      }

      // ─── SUPERVISOR pages ───
      function miniSparkline(data, color) {
        const w = 48,
          h = 22,
          pad = 3;
        const max = Math.max(...data, 1);
        const pts = data.map((v, i) => ({
          x: pad + (i / (data.length - 1)) * (w - pad * 2),
          y: h - pad - (v / max) * (h - pad * 2),
        }));
        const polyline = pts.map((p) => `${p.x},${p.y}`).join(" ");
        const last = pts[pts.length - 1];
        return `<svg width="${w}" height="${h}" class="shrink-0">
          <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
          <circle cx="${last.x}" cy="${last.y}" r="2.5" fill="${color}"/>
        </svg>`;
      }

        return `<div class="bg-white/60 rounded-[16px] px-4 py-3">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-7 h-7 rounded-full ${accent} flex items-center justify-center shrink-0">${SCHOOL_ICONS[iconKey]}</div>
            <p class="text-sm font-semibold text-ink-900">${title}</p>
          </div>
          ${body}
        </div>`;
      }

      function pageSchoolChild(id) {
        const c = SCHOOL_CHILDREN.find((x) => x.id === id) || SCHOOL_CHILDREN[0];
        const d = SCHOOL_CHILD_DETAIL[c.id] || SCHOOL_CHILD_DETAIL.ana;
        const peiEnabled = !d.isPending;
        const briefField = (val) =>
          val
            ? `<p class="text-sm text-ink-700 whitespace-pre-wrap leading-relaxed">${val}</p>`
            : `<p class="text-xs text-ink-400 italic">N\u00e3o compartilhado</p>`;

        return `
          <div class="flex flex-col gap-2 pb-2">
            <!-- Back + t&iacute;tulo -->
            <div class="flex items-center gap-2 px-1">
              <a href="#school/home" data-go="school/home" class="w-8 h-8 rounded-full bg-white/60 flex items-center justify-center hover:bg-white/80"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></a>
              <p class="text-[22px] font-bold text-ink-900">Crian&ccedil;a</p>
            </div>

            ${
              d.isPending
                ? `<div class="text-sm text-amber-900 bg-amber-50 border border-amber-200 rounded-[14px] px-4 py-3">
                <p class="font-semibold">Aguardando aprova&ccedil;&atilde;o da fam&iacute;lia</p>
                <p class="text-xs text-amber-800/90 mt-1 leading-relaxed">A conex&atilde;o com esta crian&ccedil;a foi convidada, mas a fam&iacute;lia ainda precisa aprovar em <span class="font-medium">Escola da crian&ccedil;a</span> no app. Depois disso, o compartilhamento passa a valer conforme o combinado.</p>
              </div>`
                : ""
            }

            <!-- Header da crian&ccedil;a -->
            <div class="bg-white/60 rounded-[16px] px-4 py-4 flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-accent-purple/15 text-accent-purple flex items-center justify-center text-base font-bold shrink-0">${c.initials}</div>
              <div class="flex-1 min-w-0">
                <p class="text-lg font-bold text-ink-900 truncate">${c.name}</p>
                <p class="text-xs text-ink-400">${c.age} &middot; Informa&ccedil;&otilde;es compartilhadas pela cl&iacute;nica</p>
              </div>
              <button class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold ${peiEnabled ? "bg-accent-purple text-white" : "bg-white/80 text-ink-300 cursor-not-allowed"}">Ver PEI</button>
            </div>

            ${
              d.alerts && d.alerts.length > 0
                ? `<div class="bg-red-50 border border-red-200 rounded-[16px] px-4 py-3">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-7 h-7 rounded-full bg-red-100 flex items-center justify-center shrink-0">${SCHOOL_ICONS.alert}</div>
                  <p class="text-sm font-semibold text-red-700">Alertas recentes</p>
                </div>
                <div class="flex flex-col gap-2">
                  ${d.alerts
                    .map(
                      (a) => `<div class="text-sm text-red-800 leading-relaxed">
                    <span class="text-xs text-red-500 block mb-0.5">${a.date}</span>
                    ${a.text}
                  </div>`
                    )
                    .join("")}
                </div>
              </div>`
                : ""
            }

            <!-- Grid: 4 se&ccedil;&otilde;es de info compartilhada -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">
              ${schoolSection("Diagn&oacute;stico e suporte", "diagnosis", briefField(d.brief && d.brief.diagnosis), "bg-accent-purple/10")}
              ${schoolSection("Gatilhos e estrat&eacute;gias", "triggers", briefField(d.brief && d.brief.triggers), "bg-orange-100")}
              ${schoolSection("Metas terap&ecirc;uticas ativas", "goals", briefField(d.brief && d.brief.goals), "bg-green-100")}
              ${schoolSection("Adapta&ccedil;&otilde;es para sala de aula", "adaptations", briefField(d.brief && d.brief.adaptations), "bg-accent-purple/10")}
            </div>

            ${
              d.weeklyTip
                ? `<div class="bg-amber-50 border border-amber-200 rounded-[16px] px-4 py-3">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-7 h-7 rounded-full bg-amber-100 flex items-center justify-center shrink-0">${SCHOOL_ICONS.tip}</div>
                  <p class="text-sm font-semibold text-amber-800">Sugest&atilde;o da semana</p>
                </div>
                <p class="text-sm text-amber-900 leading-relaxed">${d.weeklyTip.text}</p>
                <p class="text-xs text-amber-500 mt-2">${d.weeklyTip.date}</p>
              </div>`
                : ""
            }

            ${schoolSection(
              "Resumos mensais da cl&iacute;nica",
              "monthly",
              d.monthlySummaries && d.monthlySummaries.length > 0
                ? `<div class="flex flex-col gap-2">${d.monthlySummaries
                    .map(
                      (s) =>
                        `<div class="bg-white/50 rounded-xl p-3 border border-ink-100">
                      <p class="text-xs text-ink-400 mb-1">${s.date}</p>
                      <p class="text-sm text-ink-700 leading-relaxed">${s.text}</p>
                    </div>`
                    )
                    .join("")}</div>`
                : `<p class="text-xs text-ink-400 text-center py-3">Nenhum resumo mensal ainda.</p>`
            )}

            ${schoolSection(
              "Observa&ccedil;&otilde;es da escola",
              "observation",
              `<div class="flex items-center justify-between mb-3">
                <p class="text-xs text-ink-400">${d.isPending ? "Dispon&iacute;vel ap&oacute;s a fam&iacute;lia aprovar a conex&atilde;o." : "Seus registros do dia a dia ajudam os terapeutas."}</p>
                ${!d.isPending ? `<button class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-accent-purple text-white">+ Registrar</button>` : ""}
              </div>
              ${
                d.observations && d.observations.length > 0
                  ? `<div class="flex flex-col gap-2">${d.observations
                      .map(
                        (item) => `<div class="bg-white/50 rounded-xl p-3 border border-ink-100">
                    <div class="flex items-center justify-between mb-2">
                      <p class="text-xs font-semibold text-ink-600 capitalize">${item.month}</p>
                      ${schoolStarRating(item.attendance)}
                    </div>
                    <div class="mb-1.5">
                      <p class="text-xs text-ink-400 font-medium">Comportamento</p>
                      <p class="text-sm text-ink-700">${item.behavior}</p>
                    </div>
                    <div class="mb-1.5">
                      <p class="text-xs text-ink-400 font-medium">Desafios</p>
                      <p class="text-sm text-ink-700">${item.challenges}</p>
                    </div>
                    <div class="mb-1.5">
                      <p class="text-xs text-ink-400 font-medium">Avan&ccedil;os</p>
                      <p class="text-sm text-ink-700">${item.wins}</p>
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                      ${item.tags.map((tag) => badge(tag, "info")).join("")}
                    </div>
                  </div>`
                      )
                      .join("")}</div>`
                  : `<p class="text-xs text-ink-400 text-center py-3">Nenhuma observa&ccedil;&atilde;o registrada.</p>`
              }`
            )}
          </div>
        `;
      }

      // Stub for unimplemented pages
      function pageStub(title) {
        return `
          <div class="flex flex-col items-center justify-center py-20 gap-4">
            <div class="w-20 h-20 rounded-full bg-accent-purple/10 flex items-center justify-center">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F74E45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6"/>
              </svg>
            </div>
            <div class="text-center">
              <p class="text-lg font-bold text-ink-900">${title}</p>
              <p class="text-sm text-ink-500 mt-1">Esta tela existe no CADU rodando. No prot&oacute;tipo, foco nas p&aacute;ginas principais de cada perfil.</p>
            </div>
          </div>
        `;
      }

      // ────────────────── DISPATCH ──────────────────
      const PAGES = {
        "parent/home": pageParentHome,
        "parent/agenda": pageParentAgenda,
        "parent/evolution": pageParentEvolution,
        "parent/school": () => pageStub("Escola"),
        "parent/media": () => pageStub("M&iacute;dias"),
        "parent/messages": () => pageStub("Mensagens"),
        "therapist/today": pageTherapistToday,
        "therapist/agenda": pageTherapistAgenda,
        "therapist/reports": pageTherapistReports,
        "therapist/children": () => pageStub("Crian&ccedil;as"),
        "therapist/messages": () => pageStub("Mensagens"),
        "supervisor/approvals": pageSupervisorApprovals,
        "supervisor/agenda": pageSupervisorAgenda,
        "supervisor/people": pageSupervisorPeople,
        "supervisor/reports": () => pageStub("Relat&oacute;rios e Anamneses"),
        "supervisor/messages": () => pageStub("Mensagens"),
        "school/home": pageSchoolHome,
        "school/admin": () => pageStub("Admin Escola"),
      };

      function render() {
        const route = getHashRoute();
        const hub = document.getElementById("view-hub");
        const roleView = document.getElementById("view-role");

        if (route.page === "hub") {
          hub.hidden = false;
          roleView.hidden = true;
          return;
        }

        hub.hidden = true;
        roleView.hidden = false;

        const fullHref = route.role + "/" + route.page;

        // Special case: school child detail (path like school/child/<id>)
        let renderFn;
        if (fullHref.startsWith("school/child/")) {
          const id = fullHref.replace("school/child/", "");
          renderFn = () => pageSchoolChild(id);
          renderSidenav(route.role, "school/home");
          renderBottomNav(route.role, "school/home");
        } else {
          renderFn = PAGES[fullHref] || (() => pageStub(fullHref));
          renderSidenav(route.role, fullHref);
          renderBottomNav(route.role, fullHref);
        }

        renderTopbar(route.role);

        const content = document.getElementById("page-content");
        content.innerHTML = `<div class="anim-fade-in">${renderFn()}</div>`;

        // Render Chart.js charts if present
        if (fullHref === "parent/home") {
          renderHomeEvolutionMini("parent-evolution-chart-mini");
        } else if (fullHref === "parent/evolution") {
          setupParentEvolutionPage();
        }

        // Scroll main to top
        content.scrollTop = 0;
      }

      function renderHomeEvolutionMini(canvasId) {
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;
        const labels = PARENT_EVOLUTION.map((p) => p.date);
        const colors = {
          communication: "#5900FF",
          social_interaction: "#FF6B6B",
          emotional_regulation: "#00C49F",
          motor_skills: "#FFBB28",
        };
        new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Comunica\u00e7\u00e3o",
                data: PARENT_EVOLUTION.map((p) => p.communication),
                borderColor: colors.communication,
                backgroundColor: colors.communication + "20",
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 3,
              },
              {
                label: "Intera\u00e7\u00e3o social",
                data: PARENT_EVOLUTION.map((p) => p.social_interaction),
                borderColor: colors.social_interaction,
                backgroundColor: colors.social_interaction + "20",
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 3,
              },
              {
                label: "Regula\u00e7\u00e3o emocional",
                data: PARENT_EVOLUTION.map((p) => p.emotional_regulation),
                borderColor: colors.emotional_regulation,
                backgroundColor: colors.emotional_regulation + "20",
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 3,
              },
              {
                label: "Habilidades motoras",
                data: PARENT_EVOLUTION.map((p) => p.motor_skills),
                borderColor: colors.motor_skills,
                backgroundColor: colors.motor_skills + "20",
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: { font: { size: 11 }, color: "#6B6B6B", boxWidth: 10, padding: 12 },
              },
              tooltip: {
                backgroundColor: "rgba(255,255,255,0.95)",
                titleColor: "#161616",
                bodyColor: "#333",
                borderColor: "#eee",
                borderWidth: 1,
                cornerRadius: 12,
                padding: 12,
              },
            },
            scales: {
              y: {
                min: 0,
                max: 10,
                ticks: { color: "#999", font: { size: 11 } },
                grid: { color: "#f0f0f0" },
              },
              x: {
                ticks: { color: "#999", font: { size: 11 } },
                grid: { display: false },
              },
            },
          },
        });
      }

      // ────────────────── EVENTS ──────────────────
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-go]");
        if (!el) return;
        e.preventDefault();
        navigate(el.dataset.go);
      });

      window.addEventListener("hashchange", render);
      window.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
